    <script>
        (function () {
            var NEWS_URL = 'english/noticias.html';
            var NEWS_LINK = 'english/noticias.html';
            var MAX_NEWS = 6;

            function getItemsPerSlide() {
                var width = window.innerWidth;
                if (width < 768) return 1;
                if (width < 992) return 2;
                return 3;
            }

            fetch(NEWS_URL)
                .then(function (r) { return r.text(); })
                .then(function (html) {
                    var doc = new DOMParser().parseFromString(html, 'text/html');
                    var articles = doc.querySelectorAll('article.news-article, .container-fluid > .row.no-gutters');
                    var items = [];
                    for (var i = 0; i < articles.length && items.length < MAX_NEWS; i++) {
                        var h2 = articles[i].querySelector('h2');
                        var img = articles[i].querySelector('img');
                        var dateEl = articles[i].querySelector('.news-date-badge, h5');
                        if (h2 && img) {
                            items.push({
                                title: h2.textContent.trim(),
                                imgSrc: img.getAttribute('src').replace(/^\.\.\//g, ''),
                                date: dateEl ? dateEl.textContent.trim() : ''
                            });
                        }
                    }
                    if (!items.length) return;

                    function renderCarousel() {
                        var itemsPerSlide = getItemsPerSlide();
                        var colClass = itemsPerSlide === 1 ? 'col-12' : (itemsPerSlide === 2 ? 'col-6' : 'col-lg-4 col-md-6');
                        var inner = document.getElementById('newsCarouselInner');
                        var indicators = document.getElementById('newsCarouselIndicators');
                        inner.innerHTML = '';
                        indicators.innerHTML = '';

                        var slideIndex = 0;
                        for (var s = 0; s < items.length; s += itemsPerSlide) {
                            var slide = document.createElement('div');
                            slide.className = 'carousel-item' + (slideIndex === 0 ? ' active' : '');

                            var row = document.createElement('div');
                            row.className = 'row justify-content-center';

                            var group = items.slice(s, s + itemsPerSlide);
                            for (var j = 0; j < group.length; j++) {
                                var col = document.createElement('div');
                                col.className = colClass + ' mb-3 mb-md-0';

                                var badgeHtml = group[j].date ? '<span class="home-news-card-badge">' + group[j].date + '</span>' : '';

                                col.innerHTML =
                                    '<div class="home-news-card">' +
                                    '<a href="' + NEWS_LINK + '" class="home-news-card-link">' +
                                    '<div class="home-news-card-img-wrapper">' +
                                    '<img loading="lazy" src="' + group[j].imgSrc + '" alt="' + group[j].title + '">' +
                                    badgeHtml +
                                    '</div>' +
                                    '<div class="home-news-card-body">' +
                                    '<h3 class="home-news-card-title">' + group[j].title + '</h3>' +
                                    '<span class="home-news-card-cta">' +
                                    'Read more ' +
                                    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>' +
                                    '</span>' +
                                    '</div>' +
                                    '</a>' +
                                    '</div>';
                                row.appendChild(col);
                            }
                            slide.appendChild(row);
                            inner.appendChild(slide);

                            var indicator = document.createElement('li');
                            indicator.setAttribute('data-target', '#recipeCarousel');
                            indicator.setAttribute('data-slide-to', slideIndex.toString());
                            (function (targetIdx) {
                                indicator.addEventListener('click', function (e) {
                                    e.preventDefault();
                                    showSlide(targetIdx);
                                    startAutoPlay();
                                });
                            })(slideIndex);

                            indicators.appendChild(indicator);
                            slideIndex++;
                        }

                        showSlide(0);
                        startAutoPlay();
                    }

                    // Vanilla carousel controls
                    var carouselEl = document.getElementById('recipeCarousel');
                    var currentIndex = 0;
                    var autoPlayTimer = null;

                    function showSlide(index) {
                        var slideEls = carouselEl.querySelectorAll('.carousel-item');
                        var dotEls = carouselEl.querySelectorAll('.carousel-indicators li');
                        var total = slideEls.length;
                        if (!total) return;
                        if (index < 0) index = total - 1;
                        if (index >= total) index = 0;
                        currentIndex = index;

                        slideEls.forEach(function (el, i) {
                            if (i === currentIndex) {
                                el.classList.add('active');
                            } else {
                                el.classList.remove('active');
                            }
                        });

                        dotEls.forEach(function (el, i) {
                            if (i === currentIndex) {
                                el.classList.add('active');
                            } else {
                                el.classList.remove('active');
                            }
                        });
                    }

                    function nextSlide() { showSlide(currentIndex + 1); }
                    function prevSlide() { showSlide(currentIndex - 1); }

                    function startAutoPlay() {
                        stopAutoPlay();
                        autoPlayTimer = setInterval(nextSlide, 5000);
                    }

                    function stopAutoPlay() {
                        if (autoPlayTimer) {
                            clearInterval(autoPlayTimer);
                            autoPlayTimer = null;
                        }
                    }

                    // Prev / next buttons
                    var prevBtn = carouselEl.querySelector('.carousel-control-prev');
                    var nextBtn = carouselEl.querySelector('.carousel-control-next');
                    if (prevBtn) {
                        prevBtn.addEventListener('click', function (e) {
                            e.preventDefault();
                            prevSlide();
                            startAutoPlay();
                        });
                    }
                    if (nextBtn) {
                        nextBtn.addEventListener('click', function (e) {
                            e.preventDefault();
                            nextSlide();
                            startAutoPlay();
                        });
                    }

                    // Pause on hover
                    carouselEl.addEventListener('mouseenter', stopAutoPlay);
                    carouselEl.addEventListener('mouseleave', startAutoPlay);

                    renderCarousel();

                    var currentPerSlide = getItemsPerSlide();
                    var resizeTimer;
                    window.addEventListener('resize', function () {
                        clearTimeout(resizeTimer);
                        resizeTimer = setTimeout(function () {
                            var newPerSlide = getItemsPerSlide();
                            if (newPerSlide !== currentPerSlide) {
                                currentPerSlide = newPerSlide;
                                renderCarousel();
                            }
                        }, 250);
                    });

                    // Touch swipe support
                    var touchStartX = 0;
                    var touchEndX = 0;
                    carouselEl.addEventListener('touchstart', function (e) {
                        touchStartX = e.changedTouches[0].screenX;
                    }, { passive: true });
                    carouselEl.addEventListener('touchend', function (e) {
                        touchEndX = e.changedTouches[0].screenX;
                        if (touchStartX - touchEndX > 50) {
                            nextSlide();
                            startAutoPlay();
                        } else if (touchEndX - touchStartX > 50) {
                            prevSlide();
                            startAutoPlay();
                        }
                    }, { passive: true });
                });
        })();
    </script>
